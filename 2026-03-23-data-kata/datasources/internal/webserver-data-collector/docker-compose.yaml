services:
  webserver-data-collector-postgres:
    image: postgres:18-alpine
    container_name: webserver-data-collector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: data-collector-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5439:5432"
    volumes:
      - webserver_data_collector_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d data-collector-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-kata-net

volumes:
  webserver_data_collector_data: