services:
  report-api-database-postgres:
    image: postgres:18-alpine
    container_name: report-api-database-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - internal_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sales_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-kata-net

volumes:
  internal_postgres_data:
