services:
  external-db-postgres:
    image: postgres:18-alpine
    container_name: external-database-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: external_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - external_db_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d external_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-kata-net

volumes:
  external_db_postgres_data:
