sources:
  docker_logs:
    type: "docker_logs"

  vector_metrics:
    type: "internal_metrics"

transforms:
  parsed_logs:
    type: "remap"
    inputs: ["docker_logs"]
    source: |
      .message = parse_json(.message) ?? .message

sinks:
  out:
    type: "console"
    inputs: ["parsed_logs"]
    encoding:
      codec: "json"

  internal_metrics:
    type: "prometheus_exporter"
    inputs: ["vector_metrics"]
    address: "0.0.0.0:9090"
    default_namespace: "vector"

api:
  enabled: true
  address: "0.0.0.0:8686"
  playground: true
