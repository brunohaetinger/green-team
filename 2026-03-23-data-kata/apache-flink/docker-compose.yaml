services:

  jobmanager:
    image: flink:2.2.0-scala_2.12-java21
    hostname: jobmanager
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8082:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        execution.job-status-changed-listeners: io.openlineage.flink.listener.OpenLineageJobStatusChangedListenerFactory
      OPENLINEAGE__TRANSPORT__TYPE: http
      OPENLINEAGE__TRANSPORT__URL: http://marquez-api:4000
      OPENLINEAGE__TRANSPORT__ENDPOINT: /api/v1/lineage
      OPENLINEAGE__NAMESPACE: green-team-data-kata
    volumes:
      - flink-data:/tmp
      - ./jobs/jar:/opt/flink/jobs
      - ./libs/openlineage-flink-1.45.0.jar:/opt/flink/lib/openlineage-flink-1.45.0.jar
    networks:
      - flink-network
      - data-kata-net

  taskmanager:
    image: flink:2.2.0-scala_2.12-java21
    hostname: taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 6
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        execution.job-status-changed-listeners: io.openlineage.flink.listener.OpenLineageJobStatusChangedListenerFactory
      OPENLINEAGE__TRANSPORT__TYPE: http
      OPENLINEAGE__TRANSPORT__URL: http://marquez-api:4000
      OPENLINEAGE__TRANSPORT__ENDPOINT: /api/v1/lineage
      OPENLINEAGE__NAMESPACE: green-team-data-kata
    volumes:
      - flink-data:/tmp
      - ./jobs/jar:/opt/flink/jobs
      - ./libs/openlineage-flink-1.45.0.jar:/opt/flink/lib/openlineage-flink-1.45.0.jar
    networks:
      - flink-network
      - data-kata-net

volumes:
  flink-data:
    driver: local

networks:
  flink-network:
    driver: bridge