version: '3.8'

services:
  file-viewer:
    image: alpine
    volumes:
      - ./data:/data
    command: tail -f /dev/null

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: datakata
    ports:
      - "5432:5432"

  postgres-web-server:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: datakata
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  web-server:
    build: ./web-server
    ports:
      - "8081:8080"
    environment:
      DB_USER: user
      DB_PASSWORD: password
      DB_HOST: postgres-web-server
      DB_PORT: 5432
      DB_NAME: datakata
    depends_on:
      - postgres-web-server
