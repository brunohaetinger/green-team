lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  # Debezium metrics
  - pattern: "debezium.([^:]+):type=connector-metrics,context=([^,]+),server=([^,]+),key=([^,]+)"
    name: debezium_metrics_$4
    labels:
      plugin: "$1"
      context: "$2"
      server: "$3"
  
  # Kafka Connect Connector metrics
  - pattern: 'kafka.connect<type=connector-metrics, connector=(.+)><>(.+):'
    name: kafka_connect_connector_metrics_$2
    labels:
      connector: "$1"
    attrNameSnakeCase: true

  # Kafka Connect Task metrics
  - pattern: 'kafka.connect<type=task-metrics, connector=(.+), task=(.+)><>(.+):'
    name: kafka_connect_task_metrics_$3
    labels:
      connector: "$1"
      task: "$2"
    attrNameSnakeCase: true

  # Kafka Connect Source Task metrics
  - pattern: 'kafka.connect<type=source-task-metrics, connector=(.+), task=(.+)><>(.+):'
    name: kafka_connect_source_task_metrics_$3
    labels:
      connector: "$1"
      task: "$2"
    attrNameSnakeCase: true

  # Kafka Connect Sink Task metrics
  - pattern: 'kafka.connect<type=sink-task-metrics, connector=(.+), task=(.+)><>(.+):'
    name: kafka_connect_sink_task_metrics_$3
    labels:
      connector: "$1"
      task: "$2"
    attrNameSnakeCase: true

  # Kafka Connect Connector Error metrics
  - pattern: 'kafka.connect<type=connector-error-metrics, connector=(.+)><>(.+):'
    name: kafka_connect_connector_error_metrics_$2
    labels:
      connector: "$1"
    attrNameSnakeCase: true

  # Fallback for other Kafka Connect metrics
  - pattern: 'kafka.connect<type=(.+), connector=(.+), task=(.+)><>(.+):'
    name: kafka_connect_$1_$4
    labels:
      connector: "$2"
      task: "$3"
    attrNameSnakeCase: true

  - pattern: 'kafka.connect<type=(.+), connector=(.+)><>(.+):'
    name: kafka_connect_$1_$3
    labels:
      connector: "$2"
    attrNameSnakeCase: true
