[package]
name = "voting_system"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["ws", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
uuid = { version = "1.21.0", features = ["v7", "fast-rng"] }
futures = "0.3"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true