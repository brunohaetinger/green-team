#Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: voting-architecture
---
#Service - Go Performance Test
apiVersion: v1
kind: Service
metadata:
  name: go-performance-test-service
  namespace: voting-architecture
spec:
  type: ClusterIP
  selector:
    app: go-performance-test
  ports:
    - port: 8080
      targetPort: 8080
---


#Service - Rust Axum
# apiVersion: v1
# kind: Service
# metadata:
