#   ports:
#     - port: 3000
#       targetPort: 3000
---
#GatewayClass
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: contour
spec:
  controllerName: projectcontour.io/gateway-controller
---
#Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: voting-gateway
  namespace: voting-architecture
spec:
  gatewayClassName: contour
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
#HTTPRoute - Go
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-performance-test-route
  namespace: voting-architecture
spec:
  parentRefs:
    - name: voting-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: go-performance-test-service
          port: 8080
          weight: 100
---


