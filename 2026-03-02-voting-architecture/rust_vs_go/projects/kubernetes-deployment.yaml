---
#Deployment - Go Performance Test
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-performance-test
  namespace: voting-architecture
spec:
  selector:
    matchLabels:
      app: go-performance-test
  replicas: 2
  template:
    metadata:
      labels:
        app: go-performance-test
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - go-performance-test
              topologyKey: kubernetes.io/hostname
      containers:
        - name: go-performance-test
          image: jefoso/voting-kata:go-api
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: STORE_BACKEND
              value: "memory"
            - name: DB_URL
              value: ""
            - name: REDIS_URL
              value: ""
            - name: REDIS_QUEUE_NAME
              value: "votes"
            - name: ENABLE_REUSEPORT
              value: ""
          resources:
            limits:
              cpu: "4"
              memory: "6Gi"
            requests:
              cpu: "4"
              memory: "6Gi"

